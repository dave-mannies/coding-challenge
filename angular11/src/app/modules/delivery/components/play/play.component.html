<div class="play__container">
  <app-results-history class="play__results-history" (change)="navChanged($event)"></app-results-history>

  <ng-container>
    <div class="play mat-elevation-z2">
      <div #board class="board__container mat-elevation-z4">
        <div class="board">
          <span class="board__x-axis"></span>
          <span class="board__y-axis"></span>

          <ng-container *ngFor="let track of tracking">
          <span
            class="board__entry"
            [attr.hidden]="track.hide"
            [attr.x]="track.x"
            [attr.y]="track.y"
            [attr.pizzas]="track.pizzas"
            [attr.did]="track.dId"
            [attr.order]="track.order"
          >&nbsp;</span>
          </ng-container>
        </div>
      </div>

      <h3 class="play--heading">
        <span *ngIf="tracking.length">
          Tracking from {{ options.start }} to {{ floor(options.end) }} of {{ options.max }}.
        </span>
        <span *ngIf="!tracking.length">
          Processing...
        </span>
      </h3>

      <div class="play__pan-zoom">
        <button mat-mini-fab aria-label="Zoom In"
                [disabled]="disableZoom(1)"
                (click)="zoom(1)">
          <mat-icon>add</mat-icon>
        </button>

        <button mat-mini-fab aria-label="Zoom In"
                [disabled]="disableZoom(-1)"
                (click)="zoom(-1)">
          <mat-icon>remove</mat-icon>
        </button>
      </div>

    </div>

    <app-tracking-options
      [options]="options"
      (change)="filter()"
      *ngIf="tracking.length"></app-tracking-options>
  </ng-container>
</div>
