<label>Deliverees: </label>
<select [(ngModel)]="inputs.deliverees">
  <option *ngFor="let val of DELIVEREES" [value]="val">{{ val }}</option>
</select>
<br />

<label>Dispatch: </label>
<select [(ngModel)]="inputs.dispatch">
  <option *ngFor="let val of DISPATCHES" [value]="val">{{ val }}</option>
</select>

<input type="file" (change)="getFile($event)" />

<button (click)="getResults()">Deliver</button>
