<div class="results" *ngIf="results">
  <div>
    <label>Id:</label>
    <div class="results__id">#{{ results.id }}</div>
  </div>

  <div>
    <label>Date:</label>
    <div class="results__date">{{ results.date | date:'short' }}</div>
  </div>

  <div>
    <label>Deliverees:</label>
    <div class="results__deliverees">{{ results.deliverees }}</div>
  </div>

  <div>
    <label class="compressed--hide">Dispatch:</label>
    <div class="results__dispatch compressed--hide">{{ results.dispatch?.substring(0, 30) }}</div>
  </div>

  <div>
    <label>Pizzas delivered:</label>
    <div class="results__delivered">{{ results.pizzasCount }}</div>
  </div>

  <div>
    <label>Houses delivered to:</label>
    <div class="results__houses">{{ results.housesCount }}</div>
  </div>
</div>
