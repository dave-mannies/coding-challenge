<div class="results" *ngIf="results">
  <label>Date:</label>
  <div class="results__date">{{ results.date | date:'medium' }}</div>
  <br />

  <label>Deliverees:</label>
  <div class="results__deliverees">{{ results.deliverees }}</div>
  <br />

  <label>Dispatch:</label>
  <div class="results__dispatch">{{ results.dispatch }}</div>
  <br />

  <label>Pizzas delivered:</label>
  <div class="results__delivered">{{ results.pizzasCount }}</div>
  <br />

  <label>Houses delivered to:</label>
  <div class="results__houses">{{ results.housesCount }}</div>
</div>
