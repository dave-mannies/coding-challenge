<ng-container *ngIf="results">
  <div class="results-history">
    <button mat-mini-fab aria-label="Show Previous Results"
            [disabled]="disableNav(-1)"
            (click)="nav(-1)">
      <mat-icon>navigate_before</mat-icon>
    </button>

    <div class="results-history__history compressed">
      <div class="results">
        <app-results [results]="results.current"></app-results>
      </div>
    </div>

    <button mat-mini-fab aria-label="Show Next Results"
            [disabled]="disableNav(1)"
            (click)="nav(1)">
      <mat-icon>navigate_next</mat-icon>
    </button>
  </div>
</ng-container>
